name: Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_overlay:
        description: Allow a manual deployment to disconnect an active real overlay
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: openoverlay-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve exact green main SHA
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-production-sha.mjs

      - name: Check out exact green SHA
        run: |
          git checkout --detach "${{ steps.release.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.sha }}"

      - name: Install pinned dependencies
        run: npm ci

      - name: Install pinned Cloudflare Access client
        env:
          CLOUDFLARED_SHA256: 049777d30f9bf93da6df8bbe31383460eb2aa51a832c6551824d56f9fcc55974
        run: |
          curl --fail --show-error --silent --location \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64.deb \
            --output "${RUNNER_TEMP}/cloudflared.deb"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "${RUNNER_TEMP}/cloudflared.deb" | sha256sum --check --strict
          sudo dpkg --install "${RUNNER_TEMP}/cloudflared.deb"
          test "$(cloudflared version | awk '{print $3}')" = "2026.7.3"

      - name: Configure restricted deployment SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          install -d -m 0700 "${RUNNER_TEMP}/openoverlay-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "${RUNNER_TEMP}/openoverlay-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "${RUNNER_TEMP}/openoverlay-ssh/known_hosts"
          chmod 0600 "${RUNNER_TEMP}/openoverlay-ssh/id_ed25519" "${RUNNER_TEMP}/openoverlay-ssh/known_hosts"

      - name: Stage exact-SHA frontend without assigning production domains
        id: frontend
        working-directory: apps/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_BASE_URL: https://openoverlayapi.skylarenns.com
          VITE_OPENOVERLAY_GIT_SHA: ${{ steps.release.outputs.sha }}
          VERCEL_CLI_VERSION: 58.10.0
        run: |
          previous_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect openoverlay.skylarenns.com --format=json --token "$VERCEL_TOKEN")"
          previous_url="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.url || v.alias?.[0] || "")' "$previous_json")"
          test -n "$previous_url"
          staged_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --build-env "VITE_API_BASE_URL=$VITE_API_BASE_URL" \
            --build-env "VITE_OPENOVERLAY_GIT_SHA=$VITE_OPENOVERLAY_GIT_SHA")"
          printf 'previous_url=%s\n' "$previous_url" >> "$GITHUB_OUTPUT"
          printf 'staged_url=%s\n' "$staged_url" >> "$GITHUB_OUTPUT"

      - name: Package exact backend release
        id: archive
        run: |
          archive="${RUNNER_TEMP}/openoverlay-${{ steps.release.outputs.sha }}.tar.gz"
          git archive --format=tar.gz --output="$archive" "${{ steps.release.outputs.sha }}"
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Deploy backend through forced command
        id: backend
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set +e
          force_arg=""
          if [[ "${{ github.event_name }}" = "workflow_dispatch" && "${{ inputs.force_overlay }}" = "true" ]]; then
            force_arg=" force-overlay"
          fi
          ssh -i "${RUNNER_TEMP}/openoverlay-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ClearAllForwardings=yes \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            -o UserKnownHostsFile="${RUNNER_TEMP}/openoverlay-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            deploy-openoverlay@shhh.skylarenns.com \
            "deploy ${{ steps.release.outputs.sha }} ${{ steps.archive.outputs.checksum }}${force_arg}" \
            < "${{ steps.archive.outputs.path }}"
          result=$?
          set -e
          if [[ "$result" -eq 75 ]]; then
            printf 'deferred=true\n' >> "$GITHUB_OUTPUT"
            printf 'Deployment deferred by active-overlay or mutation guard.\n'
            exit 0
          fi
          [[ "$result" -eq 0 ]] || exit "$result"
          printf 'deferred=false\n' >> "$GITHUB_OUTPUT"

      - name: Promote frontend and verify synchronized public identity
        if: steps.backend.outputs.deferred == 'false'
        working-directory: apps/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIOUS_URL: ${{ steps.frontend.outputs.previous_url }}
          STAGED_URL: ${{ steps.frontend.outputs.staged_url }}
          VERCEL_CLI_VERSION: 58.10.0
        run: |
          rollback() {
            npx --yes "vercel@$VERCEL_CLI_VERSION" rollback "$PREVIOUS_URL" --yes --token "$VERCEL_TOKEN" || true
            ssh -i "${RUNNER_TEMP}/openoverlay-ssh/id_ed25519" \
              -o BatchMode=yes -o ClearAllForwardings=yes -o IdentitiesOnly=yes -o RequestTTY=no \
              -o UserKnownHostsFile="${RUNNER_TEMP}/openoverlay-ssh/known_hosts" -o StrictHostKeyChecking=yes \
              -o ProxyCommand='cloudflared access ssh --hostname %h' \
              deploy-openoverlay@shhh.skylarenns.com rollback || true
          }
          trap rollback ERR
          npx --yes "vercel@$VERCEL_CLI_VERSION" promote "$STAGED_URL" --yes --token "$VERCEL_TOKEN"
          cd ../..
          npm run check:deployments
          trap - ERR
